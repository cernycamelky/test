<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moje testovací stránka</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:40px}
    header{border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:20px}
    .box{padding:12px;border:1px solid #eee;border-radius:8px;max-width:600px}
    a{color:blue}
  </style>
</head>
<body>
  <header>
    <h1>Ahoj — moje stránka</h1>
    <p>Krátký popisek.</p>
  </header>

  <section class="box">
    <h2>Odkaz</h2>
    <p>Navštiv <a href="https://example.com" target="_blank" rel="noopener">example.com</a>.</p>

    <h2>Obrázek</h2>
    <!-- Nahraj obrazek.jpg do stejné složky jako index.html -->
    <img src="obrazek.jpg" alt="Ukázkový obrázek" style="max-width:100%">

    <h2>Seznam</h2>
    <ul>
      <li>Položka 1</li>
      <li>Položka 2</li>
    </ul>
  </section>
</body>
</html>
