<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>12345</title>
    <style>
      a {
        color: red;           /* barva textu */
        position: absolute;   /* umožní přesné umístění */
        top: 100px;           /* vzdálenost od horního okraje */
        left: 50px;           /* vzdálenost od levého okraje */
        text-decoration: none; /* bez podtržení */
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <!-- Odkaz na YouTube -->
    <a href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a>

    <!-- 
      Poznámky pro sebe:
      Tohle je komentář – můžeš psát cokoliv, 
      prohlížeč to ignoruje a nic se nezmění.
    -->
  </body>
</html>
